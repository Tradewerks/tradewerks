name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck · lint-free build · tests)
    runs-on: ubuntu-latest
    # prisma.config.ts resolves DATABASE_URL at load, so even `prisma generate` needs one
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck (src)
        run: npm run typecheck
      - name: Typecheck (tests) — informational until the test suite is type-clean
        run: npm run typecheck:test
        continue-on-error: true
      - name: Unit tests
        run: npm test
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
      - name: Validate migrations match schema (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
      - name: Quota concurrency test (real Postgres)
        run: npx vitest run src/lib/entitlements/__tests__/quota.test.ts src/platform/__tests__/platformAuth.test.ts src/platform/__tests__/upgradeRequestConcurrency.pg.test.ts
        env:
          QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

  frontend:
    name: Frontend (typecheck · lint · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
