<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TradeWerks</title>
		<!-- Shared by the landing page and the app; the landing page sets its own fuller title. -->
		<meta
			name="description"
			content="TradeWerks runs the office and the truck from the same record: dispatch, a technician app, an assistant that asks first, and follow-ups that stop when the client answers."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="TradeWerks" />
		<meta property="og:title" content="TradeWerks — Field service software for HVAC and the trades" />
		<meta
			property="og:description"
			content="Dispatch, a technician app, an assistant that asks first, and follow-ups that stop when the client answers. One record from the first call to the invoice."
		/>
		<meta name="twitter:card" content="summary" />
		<script>
			try {
				var t = JSON.parse(localStorage.getItem("theme-preference") || "{}");
				document.documentElement.dataset.theme = t?.state?.theme === "light" ? "light" : "dark";
			} catch (e) {
				document.documentElement.dataset.theme = "dark";
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
